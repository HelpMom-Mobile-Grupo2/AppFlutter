name: helpmom_companion
description: "HelpMom – Modo Compañero: app del acompañante durante el embarazo."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  sqflite: ^2.4.5
  path: ^1.9.1
  shared_preferences: ^2.5.6
  mobile_scanner: ^7.5.0
  url_launcher: ^6.3.3
  # 9.x usa el paquete separado material_ui y choca con package:flutter/material.dart.
  google_fonts: ^8.2.1
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/weekly_guide.json
    - assets/images/
